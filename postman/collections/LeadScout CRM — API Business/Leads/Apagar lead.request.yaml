$kind: http-request
description: Apaga permanentemente uma lead. Ação irreversível — usa com cuidado.
url: "{{baseUrl}}/api/v1/leads/{{leadId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Lead apagada (204)', function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 5000
